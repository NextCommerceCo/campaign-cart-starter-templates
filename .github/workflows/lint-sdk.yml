name: lint:sdk

# Template discipline gate. Keeps structural and runtime failures blocking while
# reporting historical verification drift without blocking routine template work:
#   1. next-core.css sync — every family must ship a byte-identical shared base
#      stylesheet (lint:next-core); no build needed, so it runs first / fails fast.
#   2. NEXT logo sync — every public surface must ship the byte-identical canonical asset.
#   3. shared generated assets — every family matches the canonical shared sources.
#   4. verification evidence — schema, references, and canonical family coverage stay valid.
#   5. SDK markup — builds all families and runs the catalog linter
#      (lint:sdk:ci = lint-sdk.mjs --scope=all --pages=all) in source + rendered modes.
#   6. verification freshness — warns when current sources have advanced beyond evidence.
#   7. agent contracts — catalog/fixture coherence and Template Reference proof are
#      hard gates; reference staleness against source_commit warns without blocking.
# This job (`lint-sdk`) is a required status check in branch protection — keep the
# job name stable so the required-check binding does not break.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Template Reference staleness diffs against templateReference.source_commit,
          # which a depth-1 checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint next-core.css sync (all families identical)
        run: npm run lint:next-core
      - name: Lint canonical NEXT logo sync (all surfaces identical)
        run: npm run lint:next-logo
      - name: Lint shared analytics sync (families match _shared/analytics)
        run: npm run lint:shared
      - name: Test template verification evidence
        run: npm run test:template-verification
      - name: Validate template verification evidence
        run: npm run validate:template-verification
      - name: Build all template families
        run: npm run build
      - name: Lint SDK markup (all families, source + rendered)
        run: npm run lint:sdk:ci
      - name: Report template verification freshness (informational)
        run: npm run report:template-verification:freshness
      - name: Lint agent contracts (Template Reference staleness is informational)
        run: npm run lint:agent-contracts
