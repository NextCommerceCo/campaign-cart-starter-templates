name: refresh-template-verification

# Closes the certification loop: whenever lint:sdk passes on main and the
# recorded verification evidence is stale (SDK bump or template change), this
# workflow regenerates template-verification.json against that exact commit,
# opens a small re-certification PR, and arms auto-merge so it lands on its own
# once lint-sdk passes. Merging clears the freshness warnings. An ordinary
# recertification therefore needs no human, and the record of it is the merge
# in history rather than a PR sitting in the queue.
#
# Only mechanical facts are refreshed (SDK version, source SHA, fingerprint,
# CI run link). campaigns_os_status is never touched — that stays a human call.
#
# CURRENT OPERATING MODE (issues #131/#163): the workflow authenticates as
# the org-owned `next-recertify-bot` GitHub App, minting a short-lived
# installation token from the RECERTIFY_APP_ID / RECERTIFY_APP_PRIVATE_KEY
# secrets. App tokens have no expiry to rotate, PRs show as authored by
# next-recertify-bot[bot], and — unlike the default github.token, which
# GitHub's anti-recursion rule excludes — PRs opened with them trigger CI
# normally, so `gh pr create` below succeeds and the source-PR comment
# fallback should never fire. (The fallback is kept as a safety net: if PR
# creation is ever refused again, the run stays GREEN and posts a comment on
# the PR whose merge staled the evidence, with a one-click compare link to
# open the re-certification PR from `bot/recertify-template-evidence`.)
#
# Auto-merge degrades the same way rather than failing: it needs the repository
# "Allow auto-merge" setting, and if that is ever turned off the request is
# refused, one line is logged, and the PR waits for a human to merge it.
# lint-sdk still gates the merge either way — `main` requires no reviews, so
# these one-file PRs have never had an approver to skip.
#
# History: before the App this ran on the default token (Actions may not
# open PRs here, so the comment fallback was the normal path), then briefly
# on a fine-grained PAT (RECERTIFY_TOKEN — the expiring stopgap from #131).

on:
  workflow_run:
    workflows: ['lint:sdk']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize runs: two green main runs in quick succession must not race on the
# shared bot branch (force-push clobber) or the open-PR existence check.
concurrency:
  group: refresh-template-verification
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RECERTIFY_APP_ID }}
          private-key: ${{ secrets.RECERTIFY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Timestamp note: workflow_run.updated_at is read at trigger time, i.e.
      # effectively the completion time of the run being recorded. Re-runs of
      # an already-recorded SHA no-op at the "already current" check, so a
      # recorded verified_at never shifts after the fact.
      - name: Refresh verification evidence
        run: >
          node scripts/refresh-template-verification.mjs
          --sha '${{ github.event.workflow_run.head_sha }}'
          --run-url '${{ github.event.workflow_run.html_url }}'
          --completed-at '${{ github.event.workflow_run.updated_at }}'
      - name: Validate refreshed manifest
        run: npm run validate:template-verification
      - name: Open re-certification PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet template-verification.json; then
            echo 'Evidence already current; no PR needed.'
            exit 0
          fi
          sdk="$(node -p "Object.values(JSON.parse(require('fs').readFileSync('_data/campaigns.json','utf8')))[0].sdk_version")"
          branch='bot/recertify-template-evidence'
          # Author commits as the App's bot user so history matches the PR
          # author (the numeric prefix is the bot user's id, required for
          # GitHub to link the email to the bot account).
          app='${{ steps.app-token.outputs.app-slug }}'
          git config user.name "${app}[bot]"
          git config user.email "$(gh api "users/${app}%5Bbot%5D" --jq .id)+${app}[bot]@users.noreply.github.com"
          # Ask GitHub to merge the PR by itself once lint-sdk goes green. Needs
          # the repository "Allow auto-merge" setting on (it is); were it ever
          # turned off the request is refused and the PR simply waits for a
          # human, as it did before. Never fail the run over it: by the time
          # this is called the evidence is committed and the PR exists.
          arm_auto_merge() {
            if gh pr merge "$1" --auto --squash; then
              echo 'Auto-merge armed; the PR lands on its own once lint-sdk passes.'
            else
              echo 'Auto-merge unavailable (repository setting is off); leaving the PR for a human to merge.'
            fi
          }
          git checkout -B "$branch"
          git add template-verification.json
          git commit -m "chore: record template verification evidence for SDK $sdk"
          # Forced push is safe here: the bot branch is owned by this workflow
          # and the concurrency group serializes writers.
          git push -f origin "$branch"
          if ! gh pr list --head "$branch" --state open --json number --jq length | grep -qx 0; then
            echo 'Re-certification PR already open; branch updated.'
            arm_auto_merge "$branch"
            exit 0
          fi
          if gh pr create \
              --head "$branch" \
              --title "chore: record template verification evidence for SDK $sdk" \
              --body "Automated re-certification. lint:sdk passed on main at \`${{ github.event.workflow_run.head_sha }}\` ([run](${{ github.event.workflow_run.html_url }})), so this records that commit as the current verification evidence in \`template-verification.json\`. Merging clears the freshness warnings. campaigns_os_status is untouched."; then
            echo 'Re-certification PR opened automatically.'
            arm_auto_merge "$branch"
            exit 0
          fi
          # Should not happen on the App token, but kept as a safety net
          # (issues #131/#163): ping the PR whose merge staled the evidence
          # instead of failing the run — the branch is ready, a human opens
          # the PR.
          echo 'gh pr create refused; notifying the source PR instead.'
          compare_url="https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"
          note="⚠️ **Re-certification needed:** this merge made the template verification evidence stale. The refresh workflow has already regenerated \`template-verification.json\` and pushed it to \`$branch\` — it just cannot open the PR itself (issue #131). **[Open the one-file PR]($compare_url)**, review, and merge to clear the freshness warnings."
          src_pr="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$src_pr" ] && [ "$src_pr" != "null" ]; then
            gh pr comment "$src_pr" --body "$note"
            echo "Pinged source PR #$src_pr."
          else
            echo "No source PR found for this push; see the step summary for the link."
          fi
          printf '%s\n' "$note" >> "$GITHUB_STEP_SUMMARY"
