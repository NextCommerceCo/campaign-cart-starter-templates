<footer class="bg-brand-light py-4 text-brand-dark">
  <div class="relative z-[1] mx-auto block w-full max-w-7xl px-10 max-[991px]:px-5">
    <div class="mx-auto flex w-full flex-col items-stretch justify-center gap-4 text-center">
      <div class="flex w-full flex-row justify-between gap-2 max-[479px]:flex-col">
        <div class="flex justify-center gap-4 text-sm max-[479px]:flex-wrap max-[479px]:gap-x-4 max-[479px]:gap-y-2">
          <a href="{{ campaign.store_shipping }}" target="_blank" class="text-brand-dark underline">Shipping Policy</a>
          <a href="{{ campaign.store_returns }}" target="_blank" class="text-brand-dark underline">Refund Policy</a>
          <a href="{{ campaign.store_privacy }}" target="_blank" class="text-brand-dark underline">Privacy Policy</a>
          <a href="{{ campaign.store_terms }}" target="_blank" class="text-brand-dark underline">Terms of Service</a>
        </div>
        <div class="text-xs">Copyright © <span class="copyright-year"></span> {{ campaign.store_name }}</div>
<script>(function(){ var y = new Date().getFullYear(); document.querySelectorAll(".copyright-year").forEach(function(el){ el.textContent = y; }); })();</script>
      </div>
    </div>
  </div>
</footer>
